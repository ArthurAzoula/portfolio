name: CI/CD — Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_CLIENT: ghcr.io/${{ github.repository }}-client
  IMAGE_SERVER: ghcr.io/${{ github.repository }}-server

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npm -w client run build
      - run: npm -w server run build

  docker:
    name: Build & Push Docker Images
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta-client
        with:
          images: ${{ env.IMAGE_CLIENT }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

      - uses: docker/metadata-action@v5
        id: meta-server
        with:
          images: ${{ env.IMAGE_SERVER }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

  deploy:
    name: Deploy to K8s
    needs: docker
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Update images
        run: |
          kubectl set image deployment/portfolio-client client=${{ env.IMAGE_CLIENT }}:latest
          kubectl set image deployment/portfolio-server server=${{ env.IMAGE_SERVER }}:latest
          kubectl rollout restart deployment/portfolio-client
          kubectl rollout restart deployment/portfolio-server
          kubectl rollout status deployment/portfolio-client --timeout=120s
          kubectl rollout status deployment/portfolio-server --timeout=120s
