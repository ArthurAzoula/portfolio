apiVersion: apps/v1
kind: Deployment
metadata:
  name: azoulux-portfolio
  labels:
    app: azoulux-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: azoulux-portfolio
  template:
    metadata:
      labels:
        app: azoulux-portfolio
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: portfolio
          image: ghcr.io/arthurazoula/portfolio:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
