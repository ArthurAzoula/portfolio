apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-client
  labels:
    app: portfolio-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-client
  template:
    metadata:
      labels:
        app: portfolio-client
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: client
          image: ghcr.io/arthurazoula/portfolio-client:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-server
  labels:
    app: portfolio-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portfolio-server
  template:
    metadata:
      labels:
        app: portfolio-server
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: server
          image: ghcr.io/arthurazoula/portfolio-server:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: strava-credentials
          volumeMounts:
            - name: strava-token
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: strava-token
          persistentVolumeClaim:
            claimName: strava-token-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: strava-token-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
